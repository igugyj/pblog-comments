name: Process Friend Link Request

on:
  issues:
    types: [labeled]

jobs:
  process:
    if: github.event.label.name == 'friend-link'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          if command -v uv &> /dev/null; then
            uv pip install requests pygithub
          else
            python -m pip install requests pygithub
          fi
      - name: Process friend request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO_FULL_NAME: ${{ github.repository }}
        run: python scripts/process_friend_request.py