name: 友链申请
description: 申请与本站交换友情链接
title: "[Friend Link Request] - "
labels: ["friend-link"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎申请友链！请在下方粘贴你准备好的 JSON 数据（格式如下）：

        ```json
        {
          "name": "你的网站名称",
          "link": ["https://你的网址.com", "https://另一个链接.com"],
          "description": "简短介绍（不超过50字）",
          "avatar": "https://example.com/avatar.png"
        }
        ```

  - type: textarea
    id: json_data
    attributes:
      label: 友链 JSON 数据
      description: 请直接粘贴完整的 JSON 对象（一个或数组均可）
      placeholder: |
        {
          "name": "示例博客",
          "link": ["https://example.com"],
          "description": "分享技术心得",
          "avatar": "https://example.com/avatar.png"
        }
      render: json
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认事项
      options:
        - label: 我已阅读并同意审核标准（网站内容健康、稳定运行）
          required: true
        - label: 我已将本站链接添加到我的网站（非强制但鼓励）
          required: false
